# -----------------------------------------------------------------------------
# Archivo para levantar Kafka con un solo comando:
#       docker compose -f kafka/docker_compose.yml up -d
#
#   [ ] Configurar un servicio Kafka accesible en localhost:9092.
#   [ ] Nombrar el contenedor "kafka" (lo usa crear_topico.sh).
#   [ ] Probarlo en al menos dos PCs del equipo, incluida la de Benjamín L.
#       (donde se grabará el video).
#   [ ] Dejar en el README los comandos para levantarlo y detenerlo.
# =============================================================================

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
